name: Release
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || \
            { echo "::error::Tag must be on the main branch"; exit 1; }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@amadeni'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI checks
        run: pnpm run ci

      # Privat auf GitHub Packages, veröffentlicht mit dem Workflow-Token des
      # Repos: kein npm-Konto, kein Secret. Consumer lesen mit einem Token
      # `read:packages` (Org-Secret GH_PACKAGES_READ, lokal `gh auth token`).
      # Eine schon vorhandene Version wird übersprungen, damit ein erneuter
      # Lauf desselben Tags nicht stirbt.
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published — skipping"
          else
            pnpm publish --no-git-checks
          fi
